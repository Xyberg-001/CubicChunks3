import io.github.opencubicchunks.gradle.GeneratePackageInfo

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id("io.github.opencubicchunks.javaheaders").version("1.2.8")
    id("io.github.opencubicchunks.gradle.mcGitVersion")
    id("io.github.opencubicchunks.gradle.mixingen")
    id("io.github.opencubicchunks.gradle.dasmgen")
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

javaHeaders {
    setAcceptedJars(".*CubicChunksCore.*")
    setConfig(file("javaHeaders.json"))
}

mcGitVersion {
    snapshot = true
    mcVersion = minecraft_version
    setCommitVersion("570c0cbf0cdc15b8348a862a519d3399a943af9", "0.0")
}

tasks.register("generatePackageInfo") {
    group = "filegen"
    doFirst {
        for (final def sourceSet in project.sourceSets) {
            GeneratePackageInfo.generateFiles(sourceSet)
        }
    }
}

tasks.register("genAll") {
    group = "filegen"
    dependsOn(generatePackageInfo, generateMixinConfigs, generateDasmConfigs)
}

dasmGen {
    filePattern = "%s.dasm.json"
    defaultMinVersion = "0.8"
    config(sourceSets.main, "cubicchunks") {
        it.packageName = "io.github.opencubicchunks.cubicchunks"
    }
}

// Scripted client runs (src/gametest, Fabric's client game test API): ./gradlew runClientGameTest opens a game window, plays the tests
// in a fresh run directory and quits
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "cubicchunks_gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
    }
}

mixinGen {
    filePattern = "cubicchunks.mixins.%s.json"
    defaultRefmap = "CubicChunks-refmap.json"
    defaultPackagePrefix = "io.github.opencubicchunks.cubicchunks.mixin"
    defaultCompatibilityLevel = "JAVA_25"
    defaultMinVersion = "0.8"
    config(sourceSets.main, "core") {
        it.required = true
        it.conformVisibility = true
        it.injectorsDefaultRequire = 1
        it.configurationPlugin = "io.github.opencubicchunks.cubicchunks.mixin.ASMConfigPlugin"
    }
    config(sourceSets.main, "access") {
        it.required = true
        it.conformVisibility = true
        it.injectorsDefaultRequire = 1
    }
    config(sourceSets.test, "test") {
        it.required = true
        it.conformVisibility = true
        it.injectorsDefaultRequire = 1
    }
    config(sourceSets.gametest, "gametest") {
        it.required = true
        it.conformVisibility = true
        it.injectorsDefaultRequire = 1
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '5000']
}

loom {
    accessWidenerPath = file("src/main/resources/cubicchunks.accesswidener")
    runs {
        configureEach {
            vmArgs("-Dmixin.debug.export=true", "-Dmixin.checks.interfaces=true", "-ea", "-XX:-OmitStackTraceInFastThrow")
        }
    }
}

// Lets the dev server read console commands (e.g. stop) typed into the Gradle run
tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}

repositories {
    maven { setUrl("https://maven.daporkchop.net/snapshot/") }
    maven { setUrl("https://maven.daporkchop.net/") }
    maven { setUrl("https://oss.sonatype.org/content/repositories/snapshots/") }
    maven { setUrl("https://jitpack.io") }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation(project(":CubicChunksCore")) {
        attributes {
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements.class, LibraryElements.JAR))
        }
        transitive = false
    }

    // dasm (MIT): the NeoForge artifact carries the transformer (shaded) and the loader-independent mixin glue (DasmExtension,
    // DasmService); only it goes in, as a second copy of the transformer clashes with its shaded one. The Fabric plugin on top of it is
    // ours (mixin/dasm/FabricDasmConfigPlugin); the annotations are only needed to compile.
    compileOnly("io.github.notstirred:dasm:3.2.0:api")
    implementation(include("io.github.notstirred:dasm-neoforge:3.2.0")) {
        transitive = false
    }
    // Came with NeoForge: @Nullable and friends, and the config format
    compileOnly("com.google.code.findbugs:jsr305:3.0.2")
    implementation(include("com.electronwill.night-config:core:3.8.2"))
    implementation(include("com.electronwill.night-config:toml:3.8.2"))
    implementation(include("io.github.opencubicchunks:regionlib:0.63.0-SNAPSHOT"))
    implementation(include("org.spongepowered:noise:2.0.0-SNAPSHOT"))
}

processResources {
    var props = [mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
                 mod_description: mod_description, minecraft_version: minecraft_version, loader_version: loader_version]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

// The tests in src/test ran on NeoForge's test framework; ported ones go in src/test-fabric
sourceSets.test.java.srcDirs = ['src/test-fabric/java']
sourceSets.test.resources.srcDirs = ['src/test-fabric/resources']

processResources.dependsOn(genAll, "CubicChunksCore:assemble")
compileJava.dependsOn("CubicChunksCore:assemble")
